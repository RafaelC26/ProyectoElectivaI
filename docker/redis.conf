# ─────────────────────────────────────────────────────────────
#  Redis — UPTC Smart Parking
# ─────────────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode no
port 6379

# Memoria: Redis es una base de datos EN MEMORIA.
# Se limita a 256 MB. Con "volatile-lru" sólo se desalojan claves con TTL
# (heartbeats, cooldowns, métricas temporales); el estado actual, los Streams
# y el ranking nunca se desalojan: su crecimiento se controla con MAXLEN.
maxmemory 256mb
maxmemory-policy volatile-lru

# Persistencia RDB: instantánea si hubo ≥100 cambios en 5 min o ≥10000 en 1 min.
# Permite que el estado sobreviva a un reinicio del contenedor (volumen redis-data).
# En producción podría habilitarse AOF (appendonly yes / appendfsync everysec).
save 300 100
save 60 10000
appendonly no
dir /data

# Observabilidad (útil en la demostración: SLOWLOG GET, LATENCY LATEST)
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 50

loglevel notice
