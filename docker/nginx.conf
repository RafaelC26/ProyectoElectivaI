server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: el backend se resuelve al momento de cada petición,
  # así nginx arranca aunque el backend todavía no esté listo.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:3000;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # WebSocket (Socket.IO)
  location /socket.io/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: /simulator, /system y /debug se resuelven en el navegador.
  location / {
    try_files $uri /index.html;
  }
}
